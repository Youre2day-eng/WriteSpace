<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WriteSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d0f;--bg2:#161619;--panel:rgba(28,28,32,0.86);--text:#ececf0;--muted:#8a8a93;--border:rgba(255,255,255,0.09);--accent:#e07a3c;--dur:0.32s;--ui:'Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,'SF Mono','Menlo',monospace;}
*{box-sizing:border-box;}html,body{margin:0;height:100%;overflow:hidden;}
body{background:radial-gradient(120% 90% at 50% -10%,var(--bg2),var(--bg) 60%);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:30px 30px;transition:opacity var(--dur) ease;}
body.no-grid::before{opacity:0;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 32%,rgba(255,255,255,.06),transparent 70%);transition:opacity var(--dur) ease;}
body.no-spot::after{opacity:0;}
.ws-shell{position:fixed;inset:0;}
.ws-wordmark{position:fixed;top:22px;left:26px;z-index:20;font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--text);opacity:.5;user-select:none;pointer-events:none;}
.ws-wordmark span{color:var(--accent);}
.ws-status{position:fixed;bottom:24px;left:26px;z-index:20;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.3px;user-select:none;pointer-events:none;}
.ws-stage{position:absolute;inset:0;cursor:grab;touch-action:none;}
.ws-stage:active{cursor:grabbing;}
.ws-world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.ws-docpos{position:relative;}
.ws-docframe{position:relative;}
.ws-docframe::before{content:'';position:absolute;inset:-60px;border-radius:30px;z-index:-1;background:radial-gradient(50% 50% at 50% 40%,rgba(255,255,255,.10),transparent 72%);opacity:1;transition:opacity var(--dur) ease;}
body.no-spot .ws-docframe::before{opacity:0;}
.artboard{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.4),0 40px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);}
.ws-editable{cursor:text;border-radius:3px;transition:background .12s ease,box-shadow .12s ease;outline:none;}
.ws-editable:hover{background:rgba(127,127,127,.16);box-shadow:0 0 0 4px rgba(127,127,127,.16);}
.ws-editable.is-editing{background:rgba(127,127,127,.12);box-shadow:0 0 0 2px var(--accent);cursor:text;}
.ws-accent{position:absolute;z-index:5;}
.ws-accent.is-selected{outline:1px dashed var(--accent);outline-offset:6px;border-radius:6px;}
.ws-handle{fill:#fff;stroke:var(--accent);stroke-width:2;cursor:grab;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));}
.ws-handle:active{cursor:grabbing;}
.ws-rowdel{opacity:0;border:none;background:none;color:#c0392b;font-size:18px;cursor:pointer;line-height:1;transition:opacity .12s;}
.ws-row:hover .ws-rowdel{opacity:.6;}
.ws-rowdel:hover{opacity:1!important;}
.ws-addrow{background:none;border:none;font-size:12px;font-weight:600;cursor:pointer;padding:10px 0 2px;opacity:.7;}
.ws-addrow:hover{opacity:1;}
.ws-check{width:20px;height:20px;border-radius:5px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-shrink:0;}
.ws-dock{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:8px;border-radius:18px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--border);box-shadow:0 16px 40px -12px rgba(0,0,0,.6);}
.ws-dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;padding:9px 6px 7px;border:none;border-radius:12px;cursor:pointer;background:transparent;color:var(--text);transition:transform var(--dur) cubic-bezier(.2,.9,.3,1.4),background .15s;}
.ws-dock-btn:hover{background:rgba(255,255,255,.08);transform:translateY(-6px) scale(1.06);}
.ws-dock-btn.is-active{color:var(--accent);background:rgba(255,255,255,.06);}
.ws-dock-label{font-size:9.5px;letter-spacing:.3px;opacity:.7;}
.ws-layer{position:relative;touch-action:none;}
.ws-layer.is-selected{outline:1px solid var(--accent);outline-offset:6px;border-radius:6px;}
.ws-layer-handles{position:absolute;inset:-8px;pointer-events:none;}
.ws-layer-handles span{position:absolute;width:8px;height:8px;border-radius:50%;border:2px solid var(--accent);background:#fff;}
.ws-layer-handles span:nth-child(1){left:-4px;top:-4px;}
.ws-layer-handles span:nth-child(2){right:-4px;top:-4px;}
.ws-layer-handles span:nth-child(3){left:-4px;bottom:-4px;}
.ws-layer-handles span:nth-child(4){right:-4px;bottom:-4px;}
.ws-inspector{position:fixed;left:18px;top:68px;z-index:45;width:320px;max-height:calc(100vh - 112px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px -25px rgba(0,0,0,.8);}
.ws-inspector-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.ws-inspector-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;}
.ws-inspector-close:hover{color:var(--text);}
.ws-layer-list{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px;}
.ws-layer-item{width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;}
.ws-layer-item:hover{border-color:var(--accent);}
.ws-layer-item.is-active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.ws-source-wrap{padding:10px;display:flex;flex-direction:column;gap:8px;}
.ws-source-wrap textarea{min-height:260px;resize:vertical;border:1px solid var(--border);border-radius:8px;background:rgba(0,0,0,.25);color:var(--text);font-family:var(--mono);font-size:11px;line-height:1.5;padding:10px;outline:none;}
.ws-source-wrap textarea:focus{border-color:var(--accent);}
.ws-source-actions{display:flex;align-items:center;gap:8px;}
.ws-source-actions button{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.ws-source-error{color:#fda4af;font-size:11px;}
.ws-source-help{font-size:11px;color:var(--muted);}
.ws-themepanel{position:fixed;top:0;right:0;height:100%;width:340px;z-index:40;background:var(--panel);backdrop-filter:blur(24px);border-left:1px solid var(--border);transform:translateX(108%);transition:transform var(--dur) cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.6);}
.ws-themepanel.is-open{transform:translateX(0);}
.ws-tp-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px;font-weight:700;font-size:16px;}
.ws-tp-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
.ws-tp-close:hover{color:var(--text);}
.ws-tp-cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px;}
.ws-tp-cat{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;}
.ws-tp-cat.is-active{background:var(--accent);border-color:var(--accent);color:#fff;}
.ws-tp-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 18px 24px;}
.ws-tp-card{text-align:left;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);cursor:pointer;padding:0 0 8px;transition:transform .15s,border-color .15s;}
.ws-tp-card:hover{transform:translateY(-3px);border-color:var(--accent);}
.ws-tp-card.is-current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.ws-tp-preview{position:relative;height:74px;border-radius:8px 8px 0 0;overflow:hidden;}
.ws-tp-band{height:22px;width:100%;}
.ws-tp-lines{padding:8px 10px;display:flex;flex-direction:column;gap:5px;}
.ws-tp-lines span{height:4px;border-radius:2px;display:block;}
.ws-tp-dot{position:absolute;right:8px;bottom:8px;width:12px;height:12px;border-radius:50%;}
.ws-tp-name{font-size:12px;font-weight:600;padding:8px 10px 0;}
.ws-tp-cat-label{font-size:10px;color:var(--muted);padding:1px 10px 0;}
.ws-launcher{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,8,10,.55);backdrop-filter:blur(14px);animation:wsFade var(--dur) ease;}
@keyframes wsFade{from{opacity:0;}to{opacity:1;}}
.ws-launcher-card{width:min(760px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 40px 100px -30px rgba(0,0,0,.8);animation:wsPop var(--dur) cubic-bezier(.2,.9,.3,1.3);}
@keyframes wsPop{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
.ws-launcher-head{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;margin-bottom:20px;}
.ws-spark{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent);}
.ws-launcher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.ws-launch-tile{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:transform .16s,border-color .16s,background .16s;}
.ws-launch-tile:hover{transform:translateY(-4px);border-color:var(--accent);background:rgba(255,255,255,.06);}
.ws-launch-glyph{margin-bottom:12px;}
.ws-launch-name{font-size:15px;font-weight:700;}
.ws-launch-blurb{font-size:11.5px;color:var(--muted);margin-top:2px;}
.ws-launch-swatches{display:flex;gap:5px;margin-top:14px;}
.ws-launch-swatches span{width:22px;height:10px;border-radius:3px;border:1px solid var(--border);}
.ws-launcher-foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;}
.ws-launcher-foot kbd{font-family:var(--mono);background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;}
.ws-palette{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;background:rgba(8,8,10,.5);backdrop-filter:blur(10px);animation:wsFade .18s ease;}
.ws-palette-card{width:min(580px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.8);animation:wsPop .2s cubic-bezier(.2,.9,.3,1.3);}
.ws-palette-input{width:100%;border:none;background:transparent;color:var(--text);font-family:var(--ui);font-size:17px;padding:18px 20px;outline:none;border-bottom:1px solid var(--border);}
.ws-palette-list{max-height:46vh;overflow-y:auto;padding:8px;}
.ws-palette-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;}
.ws-palette-item.is-active{background:rgba(255,255,255,.08);}
.ws-palette-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.ws-palette-label{flex:1;}
.ws-palette-group{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.ws-palette-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}
.ws-empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
.ws-empty button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:15px;font-weight:600;cursor:pointer;}
@media print{@page{margin:0;}}
body.ws-printing::before,body.ws-printing::after,body.ws-printing .ws-dock,body.ws-printing .ws-themepanel,body.ws-printing .ws-wordmark,body.ws-printing .ws-status,body.ws-printing .ws-handle,body.ws-printing .ws-accent.is-selected,body.ws-printing .ws-inspector,body.ws-printing .ws-layer-handles{display:none!important;}
body.ws-printing .ws-stage{position:static!important;overflow:visible!important;}
body.ws-printing .ws-world,body.ws-printing .ws-docpos{transform:none!important;position:static!important;}
body.ws-printing .ws-docframe::before{display:none!important;}
body.ws-printing .artboard{box-shadow:none!important;border-radius:0!important;}
</style>
</head>

const { useState, useEffect, useRef, useCallback } = React;


function Editable({ value, onChange, tag = 'div', style, multiline = false, className = '' }) {
  const ref = useRef(null);
  const [editing, setEditing] = useState(false);
  const Tag = tag;

  useEffect(() => {
    if (editing && ref.current) {
      const el = ref.current;
      el.innerText = value;
      el.focus();
      const r = document.createRange();
      r.selectNodeContents(el);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
  }, [editing]); // eslint-disable-line

  const commit = () => {
    if (!editing) return;
    const txt = ref.current.innerText.replace(/\u00a0/g, ' ');
    setEditing(false);
    if (txt !== value) onChange(txt);
  };

  return (
    <Tag
      ref={ref}
      contentEditable={editing}
      suppressContentEditableWarning
      spellCheck={false}
      className={'ws-editable' + (editing ? ' is-editing' : '') + (className ? ' ' + className : '')}
      style={{ whiteSpace: multiline ? 'pre-wrap' : 'normal', ...style }}
      onPointerDown={(e) => { if (editing) e.stopPropagation(); }}
      onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }}
      onBlur={commit}
      onKeyDown={(e) => {
        if (!multiline && e.key === 'Enter') { e.preventDefault(); ref.current.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); commit(); }
      }}
    >
      {editing ? null : value}
    </Tag>
  );
}



function AccentFlourish({ state, onChange, color, zoom, selected, onSelect, onDragStart }) {
  const W = 230, H = 150;
  const { x, y } = state.pos;
  const p1 = state.p1 || { x: 14, y: 96 };
  const p2 = state.p2 || { x: 216, y: 54 };
  // control point: midpoint pulled toward the upper region for a calligraphic sweep
  const cx = (p1.x + p2.x) / 2;
  const cy = Math.min(p1.y, p2.y) - 46;
  const drag = useRef(null);

  const onDown = (mode) => (e) => {
    e.stopPropagation();
    e.target.setPointerCapture?.(e.pointerId);
    onSelect();
    onDragStart?.();
    drag.current = { mode, sx: e.clientX, sy: e.clientY, start: JSON.parse(JSON.stringify({ pos: state.pos, p1, p2 })) };
  };
  const onMove = (e) => {
    if (!drag.current) return;
    const dx = (e.clientX - drag.current.sx) / zoom;
    const dy = (e.clientY - drag.current.sy) / zoom;
    const s = drag.current.start;
    if (drag.current.mode === 'move') onChange({ ...state, pos: { x: s.pos.x + dx, y: s.pos.y + dy } });
    if (drag.current.mode === 'p1') onChange({ ...state, p1: { x: s.p1.x + dx, y: s.p1.y + dy } });
    if (drag.current.mode === 'p2') onChange({ ...state, p2: { x: s.p2.x + dx, y: s.p2.y + dy } });
  };
  const onUp = () => { drag.current = null; };

  return (
    <div
      className={'ws-accent' + (selected ? ' is-selected' : '')}
      style={{ left: x, top: y, width: W, height: H }}
      onPointerMove={onMove}
      onPointerUp={onUp}
      onPointerDown={(e) => e.stopPropagation()}
    >
      <svg width={W} height={H} style={{ overflow: 'visible', display: 'block' }}>
        {/* fat invisible hit-line for grabbing the body */}
        <path d={`M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`} stroke="transparent" strokeWidth="26" fill="none"
              style={{ cursor: 'grab' }} onPointerDown={onDown('move')} />
        <path d={`M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`} stroke={color} strokeWidth="2.5" fill="none"
              strokeLinecap="round" pointerEvents="none" />
        <circle cx={p1.x} cy={p1.y} r="4.5" fill={color} pointerEvents="none" />
        <circle cx={p2.x} cy={p2.y} r="4.5" fill={color} pointerEvents="none" />
        {selected && (
          <g>
            <circle className="ws-handle" cx={p1.x} cy={p1.y} r="9" onPointerDown={onDown('p1')} />
            <circle className="ws-handle" cx={p2.x} cy={p2.y} r="9" onPointerDown={onDown('p2')} />
          </g>
        )}
      </svg>
    </div>
  );
}



function Stage({ view, setView, docPos, setDocPos, onDeselect, children }) {
  const ref = useRef(null);
  const drag = useRef(null);

  const onWheel = useCallback((e) => {
    e.preventDefault();
    setView((v) => {
      if (e.ctrlKey || e.metaKey) {
        const rect = ref.current.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const factor = Math.exp(-e.deltaY * 0.0015);
        const nz = Math.min(2.4, Math.max(0.3, v.zoom * factor));
        const k = nz / v.zoom;
        return { zoom: nz, x: mx - (mx - v.x) * k, y: my - (my - v.y) * k };
      }
      return { ...v, x: v.x - e.deltaX, y: v.y - e.deltaY };
    });
  }, [setView]);

  useEffect(() => {
    const el = ref.current;
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [onWheel]);

  const startPan = (e) => {
    if (e.button !== 0) return;
    onDeselect?.();
    drag.current = { mode: 'pan', sx: e.clientX, sy: e.clientY, start: { ...view } };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const startDoc = (e) => {
    e.stopPropagation();
    drag.current = { mode: 'doc', sx: e.clientX, sy: e.clientY, start: { ...docPos } };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const move = (e) => {
    if (!drag.current) return;
    const dx = e.clientX - drag.current.sx, dy = e.clientY - drag.current.sy;
    if (drag.current.mode === 'pan') setView((v) => ({ ...v, x: drag.current.start.x + dx, y: drag.current.start.y + dy }));
    if (drag.current.mode === 'doc') setDocPos({ x: drag.current.start.x + dx / view.zoom, y: drag.current.start.y + dy / view.zoom });
  };
  const end = () => { drag.current = null; };

  return (
    <div ref={ref} className="ws-stage" onPointerDown={startPan} onPointerMove={move} onPointerUp={end} onPointerLeave={end}>
      <div className="ws-world" style={{ transform: `translate(${view.x}px,${view.y}px) scale(${view.zoom})` }}>
        <div className="ws-docpos" style={{ transform: `translate(${docPos.x}px,${docPos.y}px)` }} onPointerDown={startDoc}>
          {children}
        </div>
      </div>
    </div>
  );
}

function DraggableLayer({ id, selected, onSelect, onDragStart, pos, onMove, zoom, style, children }) {
  const drag = useRef(null);
  const p = pos || { x: 0, y: 0 };
  const start = (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    onSelect?.(id);
    onDragStart?.();
    drag.current = { sx: e.clientX, sy: e.clientY, start: { ...p } };
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const move = (e) => {
    if (!drag.current) return;
    const dx = (e.clientX - drag.current.sx) / zoom;
    const dy = (e.clientY - drag.current.sy) / zoom;
    onMove?.(id, { x: drag.current.start.x + dx, y: drag.current.start.y + dy });
  };
  const end = () => { drag.current = null; };
  return (
    <div
      className={'ws-layer' + (selected ? ' is-selected' : '')}
      style={{ ...style, transform: `translate(${p.x}px,${p.y}px)` }}
      onPointerDown={start}
      onPointerMove={move}
      onPointerUp={end}
      onPointerLeave={end}
    >
      {children}
      {selected && <span className="ws-layer-handles"><span /><span /><span /><span /></span>}
    </div>
  );
}
function sanitizeSvgMarkup(markup) {
  if (!markup || typeof markup !== 'string') return '';
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(markup, 'image/svg+xml');
    if (doc.querySelector('parsererror')) return '';
    const blockedTags = ['script', 'style', 'foreignobject', 'iframe', 'object', 'embed', 'link', 'use', 'image', 'animate', 'animatemotion', 'animatetransform', 'set', 'feimage'];
    doc.querySelectorAll('*').forEach((el) => {
      if (blockedTags.includes((el.tagName || '').toLowerCase())) { el.remove(); return; }
      Array.from(el.attributes).forEach((attr) => {
        const n = attr.name.toLowerCase();
        const v = (attr.value || '').trim().toLowerCase();
        if (n.startsWith('on')) el.removeAttribute(attr.name);
        if (n === 'style' && (/url\s*\(/i.test(v) || /expression\s*\(/i.test(v) || /@import/i.test(v) || /-moz-binding/i.test(v))) el.removeAttribute(attr.name);
        if ((n === 'href' || n === 'xlink:href') && !(v.startsWith('#') || v.startsWith('/'))) el.removeAttribute(attr.name);
        if ((n === 'href' || n === 'xlink:href') && (v.startsWith('javascript:') || v.startsWith('data:'))) el.removeAttribute(attr.name);
      });
    });
    return new XMLSerializer().serializeToString(doc.documentElement);
  } catch {
    return '';
  }
}
function CustomSvg({ svg }) {
  const safe = React.useMemo(() => sanitizeSvgMarkup(svg), [svg]);
  if (!safe) return null;
  return <div role="img" aria-label="Custom SVG content" style={{ position: 'absolute', inset: 0 }} dangerouslySetInnerHTML={{ __html: safe }} />;
}

    cmd: <g><path d="M9 6a2.5 2.5 0 1 0 2.5 2.5V6zM15 6a2.5 2.5 0 1 1-2.5 2.5V6z" transform="translate(-1.5 1.5)" /><rect x="8" y="8" width="8" height="8" rx="1.5" /></g>,
    export: <g><path d="M12 15V4" /><path d="M8 8l4-4 4 4" /><path d="M5 16v3h14v-3" /></g>,

    code: <g><path d="M9 8L5 12l4 4" /><path d="M15 8l4 4-4 4" /><path d="M13 6l-2 12" /></g>,
  };
  return <svg viewBox="0 0 24 24" style={s}>{paths[name] || paths.card}</svg>;
}

function CommandPalette({ open, onClose, commands }) {
  const [q, setQ] = React.useState('');
  const [idx, setIdx] = React.useState(0);
  const inputRef = React.useRef(null);
  React.useEffect(() => { if (open) { setQ(''); setIdx(0); setTimeout(() => inputRef.current?.focus(), 30); } }, [open]);
  if (!open) return null;
  const filtered = commands.filter((c) => (c.label + ' ' + (c.group || '')).toLowerCase().includes(q.toLowerCase()));
  const run = (c) => { c.fn(); onClose(); };
  return (
    <div className="ws-palette" onClick={onClose}>
      <div className="ws-palette-card" onClick={(e) => e.stopPropagation()}>
        <input
          ref={inputRef}
          className="ws-palette-input"
          placeholder="Search actions, doc types, themes…"
          value={q}
          onChange={(e) => { setQ(e.target.value); setIdx(0); }}
          onKeyDown={(e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); setIdx((i) => Math.min(filtered.length - 1, i + 1)); }
            if (e.key === 'ArrowUp') { e.preventDefault(); setIdx((i) => Math.max(0, i - 1)); }
            if (e.key === 'Enter' && filtered[idx]) run(filtered[idx]);
          }}
        />
        <div className="ws-palette-list">
          {filtered.length === 0 && <div className="ws-palette-empty">No matches</div>}
          {filtered.map((c, i) => (
            <button key={c.id} className={'ws-palette-item' + (i === idx ? ' is-active' : '')} onMouseEnter={() => setIdx(i)} onClick={() => run(c)}>
              {c.swatch && <span className="ws-palette-swatch" style={{ background: c.swatch }} />}
              <span className="ws-palette-label">{c.label}</span>
              {c.group && <span className="ws-palette-group">{c.group}</span>}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

          <button onClick={onApply}>Apply JSON</button>
          {error && <span className="ws-source-error">{error}</span>}
        </div>
        <div className="ws-source-help">Tip: paste SVG markup into <code>customSvg</code>. Only use trusted SVG input; unsafe tags/attributes are stripped before render.</div>
      </div>
    </div>
  );
}
// ─── WriteSpace · app shell ──────────────────────────────────────────────────
const { useState: uS, useEffect: uE, useCallback: uC, useRef: uR } = React;

const SHELL_MOODS = {
  graphite: { bg: '#0d0d0f', bg2: '#161619', panel: 'rgba(28,28,32,0.86)', text: '#ececf0', muted: '#8a8a93', border: 'rgba(255,255,255,0.09)' },
  ink:      { bg: '#080b16', bg2: '#0f1424', panel: 'rgba(18,24,42,0.88)', text: '#e6ebf5', muted: '#7d88a3', border: 'rgba(150,170,220,0.12)' },
  bone:     { bg: '#1a1815', bg2: '#221f1b', panel: 'rgba(40,36,31,0.9)', text: '#f2ede4', muted: '#9c9384', border: 'rgba(255,245,225,0.1)' },
};
const ACCENTS = { ember: '#e07a3c', gold: '#d4a64a', teal: '#3fb6a8', violet: '#9a7cf0' };
const MOTION = { lavish: '0.55s', tasteful: '0.32s', minimal: '0.14s' };
const MAX_UNDO_HISTORY = 120;

const TWEAK_DEFAULTS = { mood:"graphite", accent:"ember", motion:"tasteful", dotGrid:true, spotlight:true };

function fitView(w, h) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const zoom = Math.min((vw - 220) / w, (vh - 200) / h, 1.15);
  return { zoom, x: (vw - w * zoom) / 2, y: (vh - h * zoom) / 2 };
}

function App() {
  const [t] = React.useState(TWEAK_DEFAULTS); const setTweak = () => {};
  const [doc, setDoc] = uS(null); // { typeId, content }
  const [themeId, setThemeId] = uS(null);
  const [preview, setPreview] = uS(null); // hovered theme id
  const [view, setView] = uS({ zoom: 1, x: 0, y: 0 });
  const [docPos, setDocPos] = uS({ x: 0, y: 0 });
  const [launcher, setLauncher] = uS(true);
  const [themesOpen, setThemesOpen] = uS(false);
  const [palette, setPalette] = uS(false);
  const [layersOpen, setLayersOpen] = uS(false);
  const [sourceOpen, setSourceOpen] = uS(false);
  const [sourceDraft, setSourceDraft] = uS('');
  const [sourceError, setSourceError] = uS('');
  const [accentSel, setAccentSel] = uS(false);
  const [selectedLayer, setSelectedLayer] = uS(null);
  const undoRef = uR([]);
  const redoRef = uR([]);

  // apply shell theme vars
  uE(() => {
    const m = SHELL_MOODS[t.mood] || SHELL_MOODS.graphite;
    const r = document.documentElement.style;
    r.setProperty('--bg', m.bg); r.setProperty('--bg2', m.bg2); r.setProperty('--panel', m.panel);
    r.setProperty('--text', m.text); r.setProperty('--muted', m.muted); r.setProperty('--border', m.border);
    r.setProperty('--accent', ACCENTS[t.accent] || ACCENTS.ember);
    r.setProperty('--dur', MOTION[t.motion] || MOTION.tasteful);
    document.body.classList.toggle('no-grid', !t.dotGrid);
    document.body.classList.toggle('no-spot', !t.spotlight);
  }, [t.mood, t.accent, t.motion, t.dotGrid, t.spotlight]);

  const snapshot = uC(() => ({
    doc: doc ? JSON.parse(JSON.stringify(doc)) : null,
    themeId,
    docPos: { ...docPos },
  }), [doc, themeId, docPos]);

  const applySnapshot = uC((s) => {
    setDoc(s.doc ? JSON.parse(JSON.stringify(s.doc)) : null);
    setThemeId(s.themeId);
    setDocPos(s.docPos || { x: 0, y: 0 });
    setPreview(null);
    setAccentSel(false);
    setSelectedLayer(null);
  }, []);

  const pushHistory = uC(() => {
    if (!doc) return;
    undoRef.current.push(snapshot());
    if (undoRef.current.length > MAX_UNDO_HISTORY) undoRef.current.shift();
    redoRef.current = [];
  }, [doc, snapshot]);

  const undo = uC(() => {
    if (!undoRef.current.length) return;
    const current = snapshot();
    const prev = undoRef.current.pop();
    redoRef.current.push(current);
    applySnapshot(prev);
  }, [snapshot, applySnapshot]);

  const redo = uC(() => {
    if (!redoRef.current.length) return;
    const current = snapshot();
    const next = redoRef.current.pop();
    undoRef.current.push(current);
    applySnapshot(next);
  }, [snapshot, applySnapshot]);

  const createDoc = uC((typeId) => {
    const d = docTypeById(typeId);
    const content = JSON.parse(JSON.stringify(d.content));
    content.accent = { pos: { ...(content.accentPos || { x: 60, y: 60 }) }, p1: { x: 14, y: 96 }, p2: { x: 216, y: 54 } };
    content.layers = ensureLayers(typeId, content);
    setDoc({ typeId, content });
    setThemeId(d.defaultTheme);
    setPreview(null);
    setLauncher(false);
    setAccentSel(false);
    setSelectedLayer(null);
    setLayersOpen(false);
    setSourceOpen(false);
    setSourceError('');
    undoRef.current = [];
    redoRef.current = [];
    setDocPos({ x: 0, y: 0 });
    setView(fitView(d.w, d.h));
  }, []);

  const set = uC((field, value, opts = {}) => {
    if (opts.track !== false) pushHistory();
    setDoc((dd) => ({ ...dd, content: { ...dd.content, [field]: value } }));
  }, [pushHistory]);
  const setLayerPos = uC((layerId, pos) => setDoc((dd) => ({
    ...dd,
    content: {
      ...dd.content,
      layers: { ...(dd.content.layers || {}), [layerId]: pos },
    },
  })), []);
  const setThemeTracked = uC((id) => {
    pushHistory();
    setThemeId(id);
    setPreview(null);
  }, [pushHistory]);
  const applySource = uC(() => {
    if (!doc) return;
    try {
      const parsed = JSON.parse(sourceDraft);
      pushHistory();
      setDoc((dd) => {
        const merged = { ...dd.content, ...parsed };
        return { ...dd, content: { ...merged, layers: ensureLayers(dd.typeId, merged) } };
      });
      setSourceError('');
    } catch (err) {
      setSourceError('Invalid JSON');
    }
  }, [doc, sourceDraft, pushHistory]);
  const fit = uC(() => { if (doc) { const d = docTypeById(doc.typeId); setDocPos({ x: 0, y: 0 }); setView(fitView(d.w, d.h)); } }, [doc]);
  const layerDefs = doc ? (LAYER_MODELS[doc.typeId] || []) : [];

  uE(() => {
    if (!doc || !sourceOpen) return;
    setSourceDraft(JSON.stringify(doc.content, null, 2));
  }, [doc, sourceOpen]);

  // keyboard
  uE(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPalette((p) => !p); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); setLauncher(true); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if (e.key === 'Escape') { setPalette(false); setLauncher(false); setThemesOpen(false); setLayersOpen(false); setSourceOpen(false); setAccentSel(false); setSelectedLayer(null); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, redo]);

  const effTheme = themeById(preview || themeId);
  const DocComp = doc ? DOC_COMPONENTS[doc.typeId] : null;
  const dt = doc ? docTypeById(doc.typeId) : null;

  // command palette commands
  const commands = [
    ...DOC_TYPES.map((d) => ({ id: 'new-' + d.id, label: 'New · ' + d.name, group: 'Create', fn: () => createDoc(d.id) })),
    { id: 'themes', label: 'Browse themes', group: 'View', fn: () => setThemesOpen(true) },
    { id: 'layers', label: 'Open layers panel', group: 'View', fn: () => setLayersOpen(true) },
    { id: 'source', label: 'Open source inspector', group: 'View', fn: () => setSourceOpen(true) },
    { id: 'fit', label: 'Fit to screen', group: 'View', fn: fit },
    { id: 'zin', label: 'Zoom in', group: 'View', fn: () => setView((v) => ({ ...v, zoom: Math.min(2.4, v.zoom * 1.2) })) },
    { id: 'zout', label: 'Zoom out', group: 'View', fn: () => setView((v) => ({ ...v, zoom: Math.max(0.3, v.zoom / 1.2) })) },
    { id: 'undo', label: 'Undo', group: 'Edit', fn: undo },
    { id: 'redo', label: 'Redo', group: 'Edit', fn: redo },
    { id: 'export', label: 'Export / Print document', group: 'Output', fn: doExport },
    ...THEMES.map((th) => ({ id: 'th-' + th.id, label: 'Theme · ' + th.name, group: th.category, swatch: th.primary, fn: () => setThemeTracked(th.id) })),
  ];

  function doExport() {
    if (!doc) return;
    document.body.classList.add('ws-printing');
    setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('ws-printing'), 400); }, 60);
  }

  return (
    <div className="ws-shell">
      <div className="ws-wordmark">Write<span>Space</span></div>
      {doc && <div className="ws-status">{dt.name} · {effTheme.name} · {Math.round(view.zoom * 100)}%</div>}

      {doc && (
        <Stage view={view} setView={setView} docPos={docPos} setDocPos={setDocPos} onDeselect={() => { setAccentSel(false); setSelectedLayer(null); }}>
          <div className="ws-docframe">
            <DocComp
              theme={effTheme}
              c={doc.content}
              set={set}
              zoom={view.zoom}
              sel={accentSel}
              onSel={() => { setAccentSel(true); setSelectedLayer('accent'); }}
              layers={doc.content.layers || {}}
              selectedLayer={selectedLayer}
              onSelectLayer={(id) => { setSelectedLayer(id); setAccentSel(id === 'accent'); }}
              onMoveLayer={setLayerPos}
              onLayerDragStart={pushHistory}
            />
          </div>
        </Stage>
      )}

      {!doc && !launcher && (
        <div className="ws-empty"><button onClick={() => setLauncher(true)}>Forge a document</button></div>
      )}

      {doc && <Dock
        onNew={() => setLauncher(true)}
        onThemes={() => setThemesOpen((o) => !o)}
        onLayers={() => setLayersOpen((o) => !o)}
        onSource={() => setSourceOpen((o) => !o)}
        onFit={fit}
        onPalette={() => setPalette(true)}
        onExport={doExport}
        themesOpen={themesOpen}
        layersOpen={layersOpen}
        sourceOpen={sourceOpen}
      />}

      <ThemePanel open={themesOpen} current={themeId} onHover={setPreview} onPick={setThemeTracked} onClose={() => setThemesOpen(false)} />
      <LayerPanel open={layersOpen && !!doc} layers={layerDefs} selected={selectedLayer} onSelect={(id) => { setSelectedLayer(id); setAccentSel(id === 'accent'); }} onClose={() => setLayersOpen(false)} />
      <SourcePanel open={sourceOpen && !!doc} value={sourceDraft} onChange={setSourceDraft} onApply={applySource} error={sourceError} onClose={() => setSourceOpen(false)} />
      <Launcher open={launcher} onPick={createDoc} onClose={() => doc && setLauncher(false)} />
      <CommandPalette open={palette} onClose={() => setPalette(false)} commands={commands} />

      
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
